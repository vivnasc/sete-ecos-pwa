<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Fundo escuro · alto contraste · arredondado -->
  <rect width="512" height="512" rx="112" fill="#1F1814"/>

  <!-- F estilizado em ouro com chama integrada -->
  <g fill="#C9A961">
    <!-- Haste vertical do F -->
    <rect x="160" y="120" width="56" height="280" rx="6"/>

    <!-- Topo do F -->
    <rect x="160" y="120" width="200" height="56" rx="6"/>

    <!-- Meio do F -->
    <rect x="160" y="232" width="160" height="48" rx="6"/>

    <!-- Chama / pico em cima · sugere fénix -->
    <path d="M 256 60
             Q 240 88 256 116
             Q 272 88 256 60 Z"/>

    <!-- Pequena chama interior -->
    <path d="M 256 76
             Q 248 92 256 108
             Q 264 92 256 76 Z"
          fill="#1F1814"/>
  </g>
</svg>
