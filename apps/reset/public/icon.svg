           C 318 130, 356 178, 374 226
           C 396 286, 392 340, 358 384
           C 332 416, 296 432, 256 432
           C 216 432, 180 416, 154 384
           C 120 340, 116 286, 138 226
           C 156 178, 194 130, 256 64 Z"
        fill="#1F1814"/>

  <!-- Núcleo interior da chama · alto contraste -->
  <path d="M 256 192
           C 280 224, 296 256, 296 296
           C 296 332, 280 360, 256 360
           C 232 360, 216 332, 216 296
           C 216 256, 232 224, 256 192 Z"
        fill="#C9A961"/>
</svg>
