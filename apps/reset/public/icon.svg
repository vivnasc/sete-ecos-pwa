<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Fundo · ouro sólido para sobressair em tabs escuras e claras -->
  <rect width="512" height="512" rx="96" fill="#C9A961"/>

  <!-- Chama única, gorda, ocupa quase todo o ícone -->
  <!-- Forma simples · lê a 16×16 -->
